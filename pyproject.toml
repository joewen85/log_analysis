[project]
name = "log-analysis-local"
version = "0.1.0"
description = "Linux log convergence pipeline with template mining and AI analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=0.7.0,<1.0.0",
    "confluent-kafka>=2.3.0,<3.0.0",
    "drain3>=0.9.0,<1.0.0",
    "openai>=1.10.0,<2.0.0",
    "requests>=2.31.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["log_pipeline"]

[tool.hatch.build.targets.sdist]
include = [
    "log_pipeline",
    "ai_convergence_service.py",
    "main.py",
    "README.md",
    "pyproject.toml",
]
